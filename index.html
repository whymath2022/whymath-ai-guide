<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhyMath Οδηγός</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
  .guide-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 0.75rem; }
  .guide-header { background: #1D9E75; border-radius: 14px; padding: 1rem 1.25rem; }
  .guide-header .day-label { color: #E1F5EE; font-size: 13px; font-weight: 500; }
  .guide-header h1 { color: #fff; font-size: 20px; font-weight: 500; margin-top: 2px; }
  .intro-card { background: #E1F5EE; border-radius: 14px; padding: 1rem 1.25rem; }
  .intro-card p { color: #085041; font-size: 14px; line-height: 1.6; }
  .chat-box { background: #fff; border-radius: 14px; padding: 1rem; min-height: 320px; display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; max-height: 420px; }
  .msg { max-width: 85%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 15px; line-height: 1.6; }
  .msg.bot { background: #1D9E75; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #F1EFE8; color: #333; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.thinking { opacity: 0.6; font-style: italic; }
  .input-row { display: flex; gap: 0.5rem; }
  .input-row input { flex: 1; padding: 0.7rem 1rem; border-radius: 10px; border: 1.5px solid #ccc; font-size: 15px; font-family: inherit; outline: none; }
  .input-row input:focus { border-color: #1D9E75; }
  .input-row button { background: #1D9E75; color: #fff; border: none; border-radius: 10px; padding: 0.7rem 1.1rem; cursor: pointer; font-size: 18px; }
  .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-msg { color: #c0392b; font-size: 13px; text-align: center; display: none; padding: 0.5rem; }
  .logo { font-size: 12px; color: #aaa; text-align: center; padding-top: 0.5rem; }
</style>
</head>
<body>
<div class="guide-wrap">
  <div class="guide-header">
    <div class="day-label" id="dayLabel">WhyMath · Ημέρα 2</div>
    <h1 id="dayTitle">Μυστήρια &amp; Κώδικες</h1>
  </div>
  <div class="intro-card">
    <p>Η Λούση έχει μια ζυγαριά και ζυγίζει διάφορα αντικείμενα. Κοίτα προσεκτικά τις δύο ζυγαριές και βρες πόσο ζυγίζει το αστέρι.</p>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-row">
    <input type="text" id="userInput" placeholder="Γράψε εδώ…" autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="error-msg" id="errMsg">Κάτι πήγε στραβά. Δοκίμασε ξανά!</div>
  <div class="logo">WhyMath · Ψηφιακός Οδηγός</div>
</div>

<script>
let messages = [];
let isLoading = false;

function addMessage(text, role) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function setThinking(show) {
  const existing = document.getElementById('thinkingMsg');
  if (show && !existing) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'msg bot thinking';
    div.id = 'thinkingMsg';
    div.textContent = '...';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  } else if (!show && existing) {
    existing.remove();
  }
}

async function callAPI(userMessage) {
  messages.push({ role: 'user', content: userMessage });
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages })
  });
  if (!response.ok) throw new Error('API error');
  const data = await response.json();
  messages.push({ role: 'assistant', content: data.reply });
  return data.reply;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  const err = document.getElementById('errMsg');
  const text = input.value.trim();
  if (!text || isLoading) return;
  isLoading = true;
  btn.disabled = true;
  err.style.display = 'none';
  addMessage(text, 'user');
  input.value = '';
  setThinking(true);
  try {
    const reply = await callAPI(text);
    setThinking(false);
    addMessage(reply, 'bot');
  } catch(e) {
    setThinking(false);
    err.style.display = 'block';
  }
  isLoading = false;
  btn.disabled = false;
  input.focus();
}

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});

window.addEventListener('load', async () => {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  setThinking(true);
  try {
    const reply = await callAPI('Γεια! Μόλις άνοιξα τον οδηγό.');
    setThinking(false);
    addMessage(reply, 'bot');
  } catch(e) {
    setThinking(false);
    addMessage('Γεια! Πώς σε λένε;', 'bot');
  }
  btn.disabled = false;
  document.getElementById('userInput').focus();
});
</script>
</body>
</html>
